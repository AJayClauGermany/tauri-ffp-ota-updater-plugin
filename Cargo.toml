[package]
name = "tauri-plugin-ffp-ota-updater"
version = "1.0.0"
authors = [ "Suraj S Singh" ]
description = "Tauri plugin for over-the-air (OTA) updates of the frontend assets"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/AJayClauGermany/tauri-ffp-ota-updater-plugin"
license = "BSL-1.0"
exclude = ["/.github", "/examples", "/dist-js", "/guest-js", "/node_modules", "/package.json", "/rollup.config.js", "/tsconfig*.json"]
links = "tauri-plugin-ffp-ota-updater"

[dependencies]
tauri = { version = "2.12.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
url = { version = "2", features = ["serde"] }
http = "1"
minisign-verify = "0.3"
base64 = "0.23"
semver = { version = "1", features = ["serde"] }
futures-util = "0.3"
percent-encoding = "2.3"
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
dom_query = "0.28"

[features]
# The same TLS and proxy features as tauri-plugin-updater, with the same defaults.
default = ["rustls-tls", "system-proxy"]
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
system-proxy = ["reqwest/system-proxy"]

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dev-dependencies]
# tests/with_updater.rs: the two plugins in one app, as docs/how-to/use-with-updater-plugin.md sets them up
tauri-plugin-updater = "2.14"
tauri = { version = "2.12.5", features = ["test"] }
minisign = "0.10"
tempfile = "3"
base64 = "0.23"
semver = "1"
serde_json = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
