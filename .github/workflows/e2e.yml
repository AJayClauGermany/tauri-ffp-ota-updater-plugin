name: End to end

# Builds examples/consent-app and drives it in the platform's own webview: a frontend is
# downloaded, held until it is approved, applied offline, and a broken one is taken back.
# See examples/consent-app/e2e.mjs.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consent-app:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install webkit2gtk and a display
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/consent-app/src-tauri
      - run: npm install
        working-directory: examples/consent-app
      - name: run the example end to end
        if: matrix.platform == 'ubuntu-latest'
        working-directory: examples/consent-app
        run: xvfb-run -a npm run e2e
      - name: run the example end to end
        if: matrix.platform != 'ubuntu-latest'
        working-directory: examples/consent-app
        run: npm run e2e
