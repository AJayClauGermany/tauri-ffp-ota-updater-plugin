<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ffp-ota-updater example</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>ffp-ota-updater example</h1>
      <p>Frontend version: <strong id="version">…</strong></p>
      <p>
        <button id="check">Check for frontend update</button>
        <button id="download" disabled>Download (apply on next launch)</button>
        <button id="install" disabled>Download and install now</button>
        <button id="apply" disabled>Apply downloaded</button>
        <button id="discard" disabled>Discard downloaded</button>
        <button id="reset">Reset to built-in</button>
      </p>
      <pre id="output"></pre>
    </main>
  </body>
</html>
