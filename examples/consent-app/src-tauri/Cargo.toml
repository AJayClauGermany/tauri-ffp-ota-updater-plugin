[package]
name = "consent-app"
version = "0.1.0"
description = "Example for tauri-plugin-ffp-ota-updater: updates the user approves, in an app with two windows"
edition = "2021"
publish = false

[lib]
name = "consent_app_lib"

[features]
# The remote control `npm run e2e` drives the app with. Not part of a normal build.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# required by `generate_context!` once `plugins` is set in tauri.conf.json
serde_json = "1"
tauri-plugin-ffp-ota-updater = { path = "../../../" }
